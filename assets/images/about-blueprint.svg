<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" aria-hidden="true">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
    <pattern id="grid-major" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="url(#grid)"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
    </pattern>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d5a4c"/>
      <stop offset="55%" stop-color="#2a3f35"/>
      <stop offset="100%" stop-color="#1c2421"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fade)"/>
  <rect width="800" height="600" fill="url(#grid-major)"/>
  <!-- subtle tool silhouettes -->
  <g fill="rgba(255,255,255,0.04)" transform="translate(520 80)">
    <path d="M0 120 L40 0 L80 120 Z"/>
    <rect x="34" y="120" width="12" height="90" rx="3"/>
  </g>
  <g fill="rgba(255,255,255,0.035)" transform="translate(80 320) rotate(-12)">
    <rect x="0" y="0" width="180" height="28" rx="4"/>
    <rect x="70" y="28" width="40" height="70" rx="4"/>
  </g>
  <g fill="none" stroke="rgba(184,134,11,0.18)" stroke-width="2" transform="translate(120 90)">
    <rect x="0" y="0" width="220" height="140" rx="8"/>
    <path d="M20 110 H200 M20 80 H160 M20 50 H120"/>
  </g>
</svg>
